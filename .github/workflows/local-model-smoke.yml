name: Optional Local Model Smoke

# Never run model jobs on pull requests or on arbitrary workflow branches.
on:
  workflow_dispatch:
    inputs:
      allow_local_models:
        description: Send fixed synthetic input to the runner's installed loopback models (no model downloads)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  local-models:
    if: github.ref == 'refs/heads/main' && inputs.allow_local_models && vars.ALETHEIA_LOCAL_MODELS_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64, aletheia-local-models]
    environment: local-model-smoke
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Memory without model dependencies
        run: python -m pip install .
      - name: Verify exact preinstalled models and run synthetic checks
        run: python -m aletheia.local_recipe --allow-local-models --report local-model-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-local-model-smoke
          path: local-model-smoke.json
          if-no-files-found: ignore
