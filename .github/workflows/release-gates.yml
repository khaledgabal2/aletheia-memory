name: Release Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "codex/v1.4-*"

jobs:
  baseline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce generic baseline boundary
        run: python scripts/release_gate.py --base-ref main

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build backend
        run: python -m pip install build
      - name: Build package
        run: python -m build
      - name: Exercise installed wheel onboarding outside the checkout
        run: |
          python -m venv /tmp/aletheia-wheel
          /tmp/aletheia-wheel/bin/python -m pip install dist/*.whl
          python scripts/v1_4_onboarding_check.py --python /tmp/aletheia-wheel/bin/python
      - name: Exercise installed source distribution onboarding
        run: |
          python -m venv /tmp/aletheia-sdist
          /tmp/aletheia-sdist/bin/python -m pip install dist/*.tar.gz
          python scripts/v1_4_onboarding_check.py --python /tmp/aletheia-sdist/bin/python

  contract-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.0.0"
          cache: npm
          cache-dependency-path: contracts/typescript/package-lock.json
      - name: Install Memory and isolated contract tooling
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --no-deps --target .legacy-1.3.1 aletheia-memory==1.3.1
          npm ci --prefix contracts/typescript --ignore-scripts --no-audit --no-fund
      - name: Generate and compile baseline consumer
        run: |
          npm run generate --prefix contracts/typescript
          python -m scripts.v1_4_discovery_contract --output contracts/typescript/generated/discovery.json
          npm run generate:discovery --prefix contracts/typescript
          python -m scripts.v1_4_read_contract --output contracts/typescript/generated/read.json
          npm run generate:read --prefix contracts/typescript
          python -m scripts.v1_4_review_contract --output contracts/typescript/generated/review.json
          npm run generate:review --prefix contracts/typescript
          npm run check --prefix contracts/typescript
          npm run build --prefix contracts/typescript
      - name: Exercise generated consumer against Memory
        run: |
          python scripts/v1_4_phase0.py --typescript
          python -m scripts.v1_4_discovery_contract --typescript
          python -m scripts.v1_4_read_contract --typescript
          python -m scripts.v1_4_review_contract --typescript
          npm test --prefix contracts/typescript
          python scripts/v1_4_compatibility_check.py --legacy-package .legacy-1.3.1
          python -m scripts.v1_4_migration_check --legacy-package .legacy-1.3.1
