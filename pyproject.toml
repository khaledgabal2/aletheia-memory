[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aletheia-memory"
version = "1.4.0"
description = "Local, auditable memory for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Aletheia Contributors" }
]
keywords = [
  "ai",
  "agents",
  "memory",
  "local-first",
  "retrieval",
  "context"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=49.0.0",
]

[project.urls]
Homepage = "https://github.com/khaledgabal2/aletheia-memory"
Repository = "https://github.com/khaledgabal2/aletheia-memory"
Documentation = "https://github.com/khaledgabal2/aletheia-memory/tree/main/docs"
Issues = "https://github.com/khaledgabal2/aletheia-memory/issues"
Changelog = "https://github.com/khaledgabal2/aletheia-memory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = []
server = []
mcp = []
dev = [
  "pytest",
  "jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7,<0.9",
]

[project.scripts]
aletheia = "aletheia.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["aletheia"]
exclude = ["**/node_modules", "**/dist", "**/__pycache__", "**/*.py[cod]"]

[tool.hatch.build.targets.wheel.force-include]
"aletheia_client.py" = "aletheia_client.py"
"docs" = "aletheia/docs"

[tool.hatch.build.targets.sdist]
exclude = [
  "**/node_modules",
  "**/dist",
  "/contracts/typescript/node_modules",
  "/contracts/typescript/generated",
  "/contracts/typescript/dist",
  "**/__pycache__",
  "**/*.py[cod]",
]
include = [
  "/aletheia",
  "/aletheia_client.py",
  "/docs",
  "/scripts",
  "/tests",
  "/contracts",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
]
